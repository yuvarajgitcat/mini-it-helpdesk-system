apiVersion: v1
kind: Pod
metadata:
  name: cpu-burn
  namespace: helpdesk
spec:
  restartPolicy: Never
  containers:
    - name: burn
      image: helpdesk-api:v1
      imagePullPolicy: IfNotPresent
      command: ["node", "-e", "while(true){}"]
      resources:
        requests: { cpu: 50m, memory: 32Mi }
        limits: { cpu: 100m, memory: 64Mi }