apiVersion: v1
kind: Pod
metadata:
  name: oom-test
  namespace: helpdesk
spec:
  restartPolicy: Never
  containers:
    - name: hog
      image: helpdesk-api:v1
      imagePullPolicy: IfNotPresent
      command: ["node", "-e", "const a=[];while(true){a.push(Buffer.alloc(10485760,1))}"]
      resources:
        requests: { cpu: 50m, memory: 32Mi }
        limits: { cpu: 100m, memory: 64Mi }