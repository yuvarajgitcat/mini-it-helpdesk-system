server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
    }
    location /uploads/ {
        proxy_pass http://api:5000;
    }
    location / {
        try_files $uri /index.html;
    }
}